<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <defs>
    <linearGradient id="altGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E3A"/>
      <stop offset="50%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="altGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Portal Emblem (Isometric A + Dimensional Cube) -->
  <g transform="translate(15, 10)">
    <circle cx="50" cy="50" r="35" fill="url(#altGrad1)" opacity="0.25" filter="url(#glow)"/>
    <path d="M 50 16 L 82 34 L 50 52 L 18 34 Z" fill="#241B35" stroke="url(#altGrad1)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 18 34 L 50 52 L 50 86 L 18 68 Z" fill="#130F1E" stroke="url(#altGrad2)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 50 52 L 82 34 L 82 68 L 50 86 Z" fill="#1C142A" stroke="url(#altGrad1)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 50 28 L 68 62 H 58 L 50 44 L 42 62 H 32 Z" fill="url(#altGrad1)"/>
    <polygon points="50,49 54,58 46,58" fill="#0E0A17"/>
    <path d="M 78 22 Q 83 22 83 17 Q 83 22 88 22 Q 83 22 83 27 Q 83 22 78 22 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography: THE ALT SPACE -->
  <g transform="translate(130, 0)">
    <text x="0" y="34" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#A78BFA">EXPERIENTIAL EVENTS</text>
    <text x="0" y="74" font-family="'Space Grotesk', system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="2" fill="#FFFFFF">THE ALT SPACE</text>
    <text x="315" y="74" font-family="'Space Grotesk', sans-serif" font-size="38" font-weight="900" fill="url(#altGrad1)">._</text>
    <rect x="0" y="88" width="55" height="3" rx="1.5" fill="url(#altGrad1)"/>
    <line x1="68" y1="89.5" x2="335" y2="89.5" stroke="#332B44" stroke-width="1.5" stroke-dasharray="3 4"/>
  </g>
</svg>

